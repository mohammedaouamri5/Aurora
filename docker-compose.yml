include:
  - back/Aurora/docker-compose.yml

services:
  back:
    image: golang:1.26
    container_name: aurora-back
    network_mode: host
    working_dir: /app
    environment:
      - GOPATH=/go
      - PATH=/usr/local/go/bin:/go/bin:$PATH
    command: >
      bash -c "GOBIN=/go/bin go install github.com/air-verse/air@latest
      && air -c .air.toml"
    env_file:
      - ./back/Aurora/app.env
    volumes:
      - ./back/Aurora:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - go_bin:/go/bin
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  front:
    image: node:22
    container_name: aurora-front
    network_mode: host
    working_dir: /app
    command: bash -c "npm install && npm run dev"
    volumes:
      - ./front/Aurora:/app
      - front_node_modules:/app/node_modules
    depends_on:
      - back
    restart: unless-stopped

volumes:
  front_node_modules:
  go_mod_cache:
  go_build_cache:
  go_bin:
